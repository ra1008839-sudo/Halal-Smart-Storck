name: halal_smart_stock
description: Complete Advanced Halal Stock Trading App with Groww-style UI and Algo Trading Bot
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  provider: ^6.1.1
  
  # Firebase
  firebase_core: ^2.24.2
  firebase_auth: ^4.16.0
  cloud_firestore: ^4.14.0
  firebase_messaging: ^14.7.10
  
  # Authentication
  google_sign_in: ^6.2.1
  local_auth: ^2.1.8
  flutter_secure_storage: ^9.0.0
  
  # Charts & Graphs
  syncfusion_flutter_charts: ^24.1.41
  fl_chart: ^0.66.0
  candlesticks: ^2.1.0
  
  # Networking
  dio: ^5.4.0
  web_socket_channel: ^2.4.0
  http: ^1.1.2
  
  # UI Components
  shimmer: ^3.0.0
  lottie: ^3.0.0
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.9
  cupertino_icons: ^1.0.6
  
  # Utilities
  intl: ^0.18.1
  shared_preferences: ^2.2.2
  sqflite: ^2.3.2
  path_provider: ^2.1.1
  
  # Audio & Voice
  audioplayers: ^5.2.1
  speech_to_text: ^6.6.0
  flutter_tts: ^3.8.5
  
  # Payments
  upi_india: ^3.0.1
  razorpay_flutter: ^1.3.6
  
  # Others
  share_plus: ^7.2.1
  url_launcher: ^6.2.3
  connectivity_plus: ^5.0.2
  permission_handler: ^11.1.0
  qr_flutter: ^4.1.0
  barcode_scanner: ^2.0.0
  image_picker: ^1.0.5
  flutter_local_notifications: ^16.3.0
  
  # Additional utilities
  uuid: ^4.2.2
  crypto: ^3.0.3
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/sounds/
    - assets/fonts/
  
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
